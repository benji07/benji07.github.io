name: Build

# Vérifie que le site se construit sur chaque PR (notamment celles de Renovate).
# Pas de secret ici : sans jeton Instagram, le build se rabat sur le portfolio.

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
