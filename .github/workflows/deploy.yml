name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Reconstruit le site chaque jour pour récupérer les dernières photos Instagram.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution de déploiement à la fois ; on laisse celle en cours finir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build avec Astro
        # withastro/action installe les dépendances (Node 24 par défaut),
        # lance `astro build` et téléverse l'artefact Pages depuis ./dist.
        uses: withastro/action@v6
        env:
          # Facultatif : sans jeton, l'accueil affiche les dernières photos du portfolio.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
